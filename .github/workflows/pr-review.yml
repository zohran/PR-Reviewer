# Runs the PR Reviewer action against this repo's own pull requests (E2E).
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so commit messages / diffs resolve correctly
          fetch-depth: 0

      - name: Run PR Reviewer
        uses: ./
        # After publishing: uses: your-org/PR-Reviewer@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional overrides:
          # fail-on-lint-errors: true
          # fail-on-test-failure: true
          # custom-test-command: 'make test'
