# Build & verify the committed dist/ bundle.
#
# GitHub Actions executes dist/index.js directly (not TypeScript), so dist/
# must stay in sync with src/. On pull requests we fail if it's stale; on
# pushes to main we rebuild and commit dist/ when needed.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (ncc → dist/)
        run: npm run build

      - name: Fail if dist/ is out of sync (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of sync with src/. Run 'npm run build' and commit the updated dist/ folder."
            git --no-pager diff --stat -- dist/
            git --no-pager diff -- dist/ | head -n 200
            exit 1
          fi
          echo "dist/ is in sync with src/."

      - name: Commit rebuilt dist/ (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild dist/'
          file_pattern: dist/*
          disable_globbing: true
