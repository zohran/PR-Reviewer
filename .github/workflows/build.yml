# Build & verify the committed dist/ bundle for the action package.
#
# GitHub Actions executes my-pr-reviewer/dist/index.js directly (not TypeScript),
# so dist/ must stay in sync with src/. On pull requests we fail if it's stale;
# on pushes to main we rebuild and commit dist/ when needed.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

defaults:
  run:
    working-directory: my-pr-reviewer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: my-pr-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (ncc → dist/)
        run: npm run build

      - name: Fail if dist/ is out of sync (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if ! git diff --quiet -- my-pr-reviewer/dist/; then
            echo "::error::my-pr-reviewer/dist/ is out of sync with src/. Run 'npm run build' inside my-pr-reviewer/ and commit the updated dist/ folder."
            git --no-pager diff --stat -- my-pr-reviewer/dist/
            git --no-pager diff -- my-pr-reviewer/dist/ | head -n 200
            exit 1
          fi
          echo "my-pr-reviewer/dist/ is in sync with src/."

      - name: Commit rebuilt dist/ (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild my-pr-reviewer/dist/'
          file_pattern: my-pr-reviewer/dist/*
          disable_globbing: true
