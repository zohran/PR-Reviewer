#
name: "PR Reviewer"
description: "Automated PR review with lint, tests, and LLM-powered feedback"
author: "PR Reviewer"

inputs:
  github-token:
    description: "GitHub token with permission to read PRs and post review comments"
    required: true
  anthropic-api-key:
    description: "Anthropic API key used for LLM-powered code review"
    required: true
  fail-on-lint-errors:
    description: "Fail the action when lint errors are found"
    required: false
    default: "true"
  fail-on-test-failure:
    description: "Fail the action when tests fail"
    required: false
    default: "true"
  custom-test-command:
    description: "Optional shell command that overrides language-default test commands"
    required: false
    default: ""

runs:
  using: "node20"
  main: "dist/index.js"
